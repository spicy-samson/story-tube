<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Posterize social preview</title>
  <desc id="description">Posterize wordmark beside two vertical video story poster examples.</desc>
  <rect width="1200" height="630" fill="#f3f4f6"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#111318"/>

  <g font-family="Arial, Helvetica, sans-serif">
