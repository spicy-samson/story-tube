    <text x="112" y="260" fill="#ffffff" font-size="58" font-weight="700">Turn a video link</text>
    <text x="112" y="329" fill="#ffffff" font-size="58" font-weight="700">into a story worth</text>
    <text x="112" y="398" fill="#ffffff" font-size="58" font-weight="700">sharing.</text>
    <text x="112" y="468" fill="#aeb3bd" font-size="24">Paste. Choose a look. Export 1080 x 1920.</text>
  </g>

